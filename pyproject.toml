[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "normais-climatologicas-inmet"
version = "0.1.0"
description = "API para consulta de Normais Climatológicas do Brasil (1991-2020)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0"}
authors = [
    {name = "Salles Moura", email = "sallesmouraa@github.com"}
]
keywords = [
    "clima",
    "climatologia",
    "brasil",
    "INMET",
    "normais-climatologicas",
    "geospatial",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
]

[project.urls]
Homepage = "https://github.com/sallesmouraa/normais-climatologicas-inmet-brasil"
Documentation = "https://github.com/sallesmouraa/normais-climatologicas-inmet-brasil#readme"
Repository = "https://github.com/sallesmouraa/normais-climatologicas-inmet-brasil.git"
Issues = "https://github.com/sallesmouraa/normais-climatologicas-inmet-brasil/issues"
